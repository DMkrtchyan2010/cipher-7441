<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cipher-7441 // Bob Receiver Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Share Tech Mono', monospace; background-color: #02080d; color: #00f0ff; overflow-x: hidden; }
        .qb-font { font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 2px; }
        .qb-panel { background: #02121a; border-left: 3px solid #00f0ff; border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.08); }
        .qb-glow { text-shadow: 0 0 10px rgba(0, 240, 255, 0.8); }
    </style>
</head>
<body class="min-h-screen p-6 max-w-[1600px] mx-auto flex flex-col justify-between">
    <header class="flex justify-between items-center border-b border-cyan-500/30 pb-4 mb-6">
        <div>
            <div class="text-[10px] text-cyan-500/60 tracking-widest">CIPHER-7441 // NODE 02 // RECEIVER COMMAND</div>
            <h1 class="text-3xl font-bold qb-font qb-glow text-cyan-400">BOB // DECRYPTION & SIFTING TERMINAL</h1>
        </div>
        <div id="sys-status" class="px-4 py-1.5 text-xs font-bold qb-panel text-cyan-300 qb-glow">SYS: ONLINE</div>
    </header>
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-6">
        <div class="lg:col-span-4 space-y-6">
            <div class="qb-panel p-6 space-y-3">
                <h3 class="text-xs font-bold text-cyan-400 qb-font">DECRYPTED MESSAGE PAYLOAD</h3>
                <div id="decrypted-payload" class="font-mono text-sm text-cyan-200 bg-cyan-950/20 p-3 border border-cyan-500/40 min-h-[50px]">
                    [WAITING FOR TRANSMISSION...]
                </div>
            </div>
            <div class="qb-panel p-6 space-y-2">
                <div class="text-[10px] text-cyan-400">SIFTED MATCHES: <span id="sifted-matches" class="font-bold text-white">0 / 0</span></div>
                <div class="text-[10px] text-cyan-400">QBER RATE: <span id="qber-rate" class="font-bold text-white">0.0%</span></div>
            </div>
        </div>
        <div class="lg:col-span-8 qb-panel p-5 space-y-2">
            <h3 class="text-xs font-bold text-cyan-400 qb-font">LIVE RECEPTION & SIFTING OBSERVATION TERMINAL</h3>
            <div id="bobTerminal" class="bg-black/90 p-3 h-64 overflow-y-auto font-mono text-xs text-cyan-300/90 space-y-1 border border-cyan-500/30">
                <div class="text-gray-500">// Receiver listening on optical fiber mesh...</div>
            </div>
        </div>
    </main>
    <script>
        const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/mesh');

        ws.onmessage = (event) => {
            const packet = JSON.parse(event.data);
            if (packet.type === 'ALICE_EMIT') {
                const data = packet.data;
                const logs = data.photon_logs || [];
                let siftedCount = logs.filter(p => p.alice_basis === p.bob_basis).length;
                
                document.getElementById('sifted-matches').innerText = `${siftedCount} / ${logs.length}`;
                document.getElementById('qber-rate').innerText = `${(data.qber * 100).toFixed(2)}%`;

                if (data.ciphertext && data.ciphertext !== "REJECTED_BREACH_PANIC_TRIGGERED") {
                    try {
                        const rawKey = data.derived_key || "FALLBACK";
                        const binaryString = atob(data.ciphertext);
                        let decrypted = "";
                        for (let i = 0; i < binaryString.length; i++) {
                            decrypted += String.fromCharCode(binaryString.charCodeAt(i) ^ rawKey.charCodeAt(i % rawKey.length));
                        }
                        document.getElementById('decrypted-payload').innerText = decrypted;
                    } catch (e) {
                        document.getElementById('decrypted-payload').innerText = data.plaintext || "DECRYPTION ERROR";
                    }
                } else {
                    document.getElementById('decrypted-payload').innerText = "[CRITICAL: BREACH DETECTED - MESSAGE PURGED]";
                }

                const term = document.getElementById('bobTerminal');
                term.innerHTML = "";
                logs.slice(-30).forEach(p => {
                    let match = p.alice_basis === p.bob_basis;
                    term.innerHTML += `<div class="${match ? 'text-cyan-300' : 'text-gray-500'}">• Photon #${p.id}: Alice[${p.alice_basis}] vs Bob[${p.bob_basis}] -> Match: ${match ? 'YES' : 'NO'}</div>`;
                });
                term.scrollTop = term.scrollHeight;
            }
        };
    </script>
</body>
</html>
